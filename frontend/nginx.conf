server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # AI service (FastAPI) - must come before the generic /api/ rule
  location /api/ai/ {
    proxy_pass http://ai-service:8000;
    proxy_set_header Host $host;
  }

  # Spring Boot REST API
  location /api/ {
    proxy_pass http://backend-api:8080;
    proxy_set_header Host $host;
  }

  # Angular client-side routes: /analytics, /ai-insights ... must not 404 on refresh
  location / {
    try_files $uri $uri/ /index.html;
  }
}
