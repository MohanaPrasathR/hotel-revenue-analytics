name: Backend CI

on:
  push:
    paths:
      - 'hotel-revenue-analytics-api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'hotel-revenue-analytics-api/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build & Test Spring Boot 3 Microservice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: hotel-revenue-analytics-api
        run: mvn -B clean verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: hotel-revenue-analytics-api/target/surefire-reports/
