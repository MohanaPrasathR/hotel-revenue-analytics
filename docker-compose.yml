name: stay-pulse

services:
  mysql-db:
    image: mysql:8.0
    container_name: stay-pulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stay_pulse_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - stay-pulse-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./stay-pulse-api
      dockerfile: Dockerfile
    container_name: stay-pulse-api
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql-db:3306/stay_pulse_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "8080:8080"
    networks:
      - stay-pulse-network

  ai-service:
    build:
      context: ./ai-service
    container_name: stay-pulse-ai
    restart: unless-stopped
    depends_on:
      - backend-api
    environment:
      BOOKINGS_API_URL: http://backend-api:8080/api/bookings
      DATA_SOURCE: auto            # uses synthetic history until the API has enough bookings
      # ANTHROPIC_API_KEY: ...     # optional: enables LLM answers in "Ask your data"
      # AI_MODEL: ...
    ports:
      - "8000:8000"
    networks:
      - stay-pulse-network

  frontend-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stay-pulse-frontend
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "4200:80"
    networks:
      - stay-pulse-network

networks:
  stay-pulse-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
