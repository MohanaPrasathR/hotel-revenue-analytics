services:
  mysql-db:
    image: mysql:8.0
    container_name: hotel-analytics-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hotel_analytics_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./hotel-revenue-analytics-api
      dockerfile: Dockerfile
    container_name: hotel-analytics-api
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql-db:3306/hotel_analytics_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    networks:
      - hotel-network

  frontend-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel-analytics-frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "4200:80"
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
