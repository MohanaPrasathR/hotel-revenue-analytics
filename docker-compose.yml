name: stay-pulse

services:
  mysql-db:
    image: mysql:8.0
    container_name: stay-pulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stay_pulse_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - stay-pulse-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./stay-pulse-api
      dockerfile: Dockerfile
    container_name: stay-pulse-api
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql-db:3306/stay_pulse_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    networks:
      - stay-pulse-network

  frontend-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stay-pulse-frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "4200:80"
    networks:
      - stay-pulse-network

networks:
  stay-pulse-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
